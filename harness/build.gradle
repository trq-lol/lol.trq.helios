// Development launcher: boots Forge 1.8.9 on LWJGL 3 through a released lol.trq.lazarus jar, with the test mod.
// Not published.
import java.security.MessageDigest

evaluationDependsOn(':harness-mod')

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
}

def javaFor = { int version ->
    javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(version) }
}

def cacheDir = rootProject.layout.projectDirectory.dir('.harness-cache')
def lazarusVersion = rootProject.property('lazarusVersion')
// -PlazarusJar=<path> runs against a locally built Lazarus jar instead of the release, for example one built from a
// branch that the release does not include yet.
def localLazarus = project.findProperty('lazarusJar')
if (localLazarus != null && localLazarus.toString().isBlank()) {
    throw new GradleException('-PlazarusJar is empty')
}
def lazarusJar = localLazarus
        ? rootProject.layout.projectDirectory.file(new File(localLazarus.toString()).absolutePath)
        : cacheDir.file("lazarus/lol.trq.lazarus-${lazarusVersion}.jar")
def lwjgl3Jar = localLazarus
        ? layout.buildDirectory.file('lazarus-local/lwjgl3.jar').get()
        : cacheDir.file("lazarus/lol.trq.lazarus-lwjgl3-${lazarusVersion}.jar")
def modJar = project(':harness-mod').tasks.named('jar')

def fetchLazarus = tasks.register('fetchLazarus') {
    group = 'helios'
    description = "Downloads the lol.trq.lazarus ${lazarusVersion} release jar, checks its SHA-256 and extracts the LWJGL 3 jar."
    outputs.files(lwjgl3Jar)
    outputs.upToDateWhen { false }
    doLast {
        def base = "https://github.com/trq-lol/lol.trq.lazarus/releases/download/v${lazarusVersion}/lol.trq.lazarus-${lazarusVersion}.jar"
        def jar = lazarusJar.asFile
        if (localLazarus) {
            if (!jar.isFile()) {
                throw new GradleException("-PlazarusJar: ${jar} does not exist")
            }
        } else {
            jar.parentFile.mkdirs()
            if (!jar.isFile()) {
                new URL(base).withInputStream { input -> jar.withOutputStream { it << input } }
            }
            def expected = new URL(base + '.sha256').text.trim().split(/\s+/)[0].toLowerCase()
            def actual = MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
            if (actual != expected) {
                jar.delete()
                throw new GradleException("lol.trq.lazarus ${lazarusVersion}: SHA-256 mismatch (expected ${expected}, got ${actual})")
            }
        }
        lwjgl3Jar.asFile.parentFile.mkdirs()
        def zip = new java.util.zip.ZipFile(jar)
        try {
            def entry = zip.getEntry('META-INF/lazarus/lwjgl3.jar')
            if (entry == null) {
                throw new GradleException('META-INF/lazarus/lwjgl3.jar missing from the Lazarus jar')
            }
            lwjgl3Jar.asFile.withOutputStream { it << zip.getInputStream(entry) }
        } finally {
            zip.close()
        }
    }
}

// System properties for the test mod: where reference images live, and whether to rewrite them (-PupdateReferences).
def harnessJvmArgs = {
    def refs = rootProject.layout.projectDirectory.dir('harness/references').asFile.absolutePath
    def args = ["-Dhelios.harness.references=${refs}"]
    if (project.hasProperty('updateReferences')) args << '-Dhelios.harness.updateReferences=true'
    if (project.hasProperty('requireReferences')) args << '-Dhelios.harness.requireReferences=true'
    if (project.hasProperty('bench')) args << '-Dhelios.harness.bench=true'
    if (project.hasProperty('world')) args << '-Dhelios.harness.world=true'
    if (project.hasProperty('jvmArgs')) args << project.property('jvmArgs')
    args.join(' ')
}

def registerRun = { String name, int javaVersion ->
    tasks.register(name, JavaExec) {
        group = 'helios'
        description = "Boots Forge 1.8.9 on LWJGL 3 through Lazarus on Java $javaVersion, runs the Helios checks on the main menu and exits."
        dependsOn fetchLazarus, modJar
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'lol.trq.helios.harness.DevLaunch'
        def launcher = javaFor(javaVersion)
        doFirst {
            def mods = [modJar.get().archiveFile.get().asFile.absolutePath]
            if (project.hasProperty('optifine')) mods << file(project.property('optifine')).absolutePath
            def runDir = layout.buildDirectory.dir("run/$name${project.hasProperty('optifine') ? '-optifine' : ''}").get().asFile
            args = [
                "java=${launcher.get().executablePath.asFile.absolutePath}",
                'mode=lazarus',
                "runtime=${lazarusJar.asFile.absolutePath}",
                "mods=${mods.join(File.pathSeparator)}",
                'lwjgl3=true',
                "lwjgl3Jar=${lwjgl3Jar.asFile.absolutePath}",
                "cache=${cacheDir.asFile.absolutePath}",
                "gameDir=${runDir.absolutePath}",
                "jvmArgs=${harnessJvmArgs()}",
                "timeout=${project.findProperty('timeout') ?: '300'}",
            ]
        }
    }
}

registerRun('runHarness17', 17)
registerRun('runHarness21', 21)
registerRun('runHarness25', 25)
