plugins {
    id 'java-library'
    id 'maven-publish'
    id 'me.champeau.jmh' version '0.7.4'
}

base.archivesName = 'lol.trq.helios'

evaluationDependsOn(':fontgen')

// The bundled font atlas is generated at build time from fonts/inter by the fontgen module.
def fontsDir = layout.buildDirectory.dir('generated/fonts')
def generateFonts = tasks.register('generateFonts', JavaExec) {
    group = 'helios'
    description = 'Builds the bundled MSDF font atlases.'
    def ttf = rootProject.file('fonts/inter/Inter-Regular.ttf')
    def out = fontsDir.get().file('lol/trq/helios/fonts/inter.hfnt').asFile
    def preview = layout.buildDirectory.file('fontgen/inter.png').get().asFile
    inputs.file(ttf)
    inputs.files(project(':fontgen').sourceSets.main.runtimeClasspath)
    outputs.dir(fontsDir)
    outputs.file(preview)
    classpath = project(':fontgen').sourceSets.main.runtimeClasspath
    mainClass = 'lol.trq.helios.fontgen.FontGen'
    systemProperty 'java.awt.headless', 'true'
    args '--font', ttf.absolutePath, '--out', out.absolutePath, '--name', 'inter', '--size', '40', '--range', '4',
        '--png', preview.absolutePath
    doFirst { preview.parentFile.mkdirs() }
}
sourceSets.main.resources.srcDir(files(fontsDir).builtBy(generateFonts))

java {
    withSourcesJar()
}

dependencies {
    compileOnly "org.lwjgl:lwjgl:${lwjglVersion}"
    compileOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// CPU benchmarks: ./gradlew :helios:jmh [-Pjmh.include=<regex>]. GPU timings come from the harness (-Pbench).
jmh {
    jmhVersion = '1.37'
    fork = 1
    warmupIterations = 3
    warmup = '1s'
    iterations = 5
    timeOnIteration = '1s'
    benchmarkMode = ['avgt']
    timeUnit = 'ns'
    profilers = ['gc']
    failOnError = true
    resultFormat = 'JSON'
    if (project.hasProperty('jmh.include')) {
        includes = [project.property('jmh.include')]
    }
}

dependencies {
    jmhImplementation "org.lwjgl:lwjgl:${lwjglVersion}"
    jmhImplementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': 'lol.trq.helios', 'Implementation-Version': project.version)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'lol.trq.helios'
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/trq-lol/lol.trq.helios')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
            }
        }
    }
}
