name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew spotlessCheck build -Pversion=${GITHUB_REF_NAME#v}
      - name: Publish to GitHub Packages
        run: ./gradlew :helios:publishAllPublicationsToGitHubPackagesRepository -Pversion=${GITHUB_REF_NAME#v}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          for kind in "" "-sources"; do
            cp "helios/build/libs/lol.trq.helios-${version}${kind}.jar" .
            sha256sum "lol.trq.helios-${version}${kind}.jar" > "lol.trq.helios-${version}${kind}.jar.sha256"
          done
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "lol.trq.helios $version" --notes-file notes.md \
            lol.trq.helios-${version}.jar lol.trq.helios-${version}.jar.sha256 \
            lol.trq.helios-${version}-sources.jar lol.trq.helios-${version}-sources.jar.sha256
