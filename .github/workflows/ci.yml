name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck build

  # Boots Forge 1.8.9 on LWJGL 3 through Lazarus under a virtual display with software OpenGL (Mesa), and fails
  # unless every in-game rendering check passes, including blur and bloom against the 854x480 Mesa references.
  harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libxxf86vm1 libxrandr2 libxcursor1 libxi6 x11-xserver-utils
      - uses: actions/cache@v4
        with:
          path: .harness-cache
          key: harness-${{ hashFiles('gradle.properties') }}
          restore-keys: harness-
      - name: Run the harness on Java ${{ matrix.java }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :harness:runHarness${{ matrix.java }} -PrequireReferences -Ptimeout=900 | tee harness.log
          grep -q "HELIOS-HARNESS OK java=${{ matrix.java }}" harness.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-java${{ matrix.java }}
          path: harness/build/run/*/helios/
